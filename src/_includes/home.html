<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if title %}{{ title }}{% endif %} </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Trajan+Pro:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
    <div class="home-header-container">
        <img src="/images/gputhinker.png" class="home-header-image">
        {% include "header.html" %}
    </div>

    <main class="main">
        {{ content | safe }}
    </main>

    <footer class="footer">
        <p>&copy; {{site.year}} {{site.name}}. All rights reserved.</p>
    </footer>
</body>
</html>
