<div class="projects-overlay" id="projectsOverlay">
    <button class="overlay-back-button" id="projectsBackButton">← Back</button>
    <div class="projects-overlay-content">
        <h2 class="projects-overlay-title">Projects</h2>
        <div class="projects-overlay-text">
            <p>Here you'll find a showcase of my technical projects, including web applications, software tools, and creative coding experiments.</p>
            <p>Each project demonstrates different aspects of my development skills and problem-solving approach.</p>
            <p>More projects coming soon...</p>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const projectsLink = document.getElementById('projectsLink');
        const homeContainer = document.getElementById('homeContainer');
        const projectsOverlay = document.getElementById('projectsOverlay');
        const projectsBackButton = document.getElementById('projectsBackButton');

        if (projectsLink) {
            projectsLink.addEventListener('click', function (e) {
                e.preventDefault();

                // Close about overlay if it's open
                const aboutOverlay = document.getElementById('aboutOverlay');
                if (aboutOverlay && aboutOverlay.classList.contains('fade-in')) {
                    homeContainer.classList.remove('slide-left');
                    aboutOverlay.classList.remove('fade-in');
                    
                    // Wait for about overlay to close before opening Projects
                    setTimeout(() => {
                        homeContainer.classList.add('fade-out');
                        projectsOverlay.classList.add('fade-in');
                    }, 800);
                } else {
                    // Add fade-out class to home container
                    homeContainer.classList.add('fade-out');

                    // Add fade-in class to projects overlay
                    projectsOverlay.classList.add('fade-in');
                }
            });
        }

        if (projectsBackButton) {
            projectsBackButton.addEventListener('click', function () {
                // Remove classes to reverse animation
                homeContainer.classList.remove('fade-out');
                projectsOverlay.classList.remove('fade-in');
            });
        }

        // Handle browser back button
        window.addEventListener('popstate', function () {
            homeContainer.classList.remove('fade-out');
            projectsOverlay.classList.remove('fade-in');
        });
    });
</script>
